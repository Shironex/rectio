name: ci

# The checks of `pnpm gate` (format, typecheck, lint, test, build, repo rules), run one after
# another. `pnpm gate` runs them in parallel, which on a fresh runner races: lint needs the route
# types that `next typegen` writes during typecheck, and test and build both build the template
# previews into the same folders. One job: the steps share one install and one Turborepo cache.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request replaces the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The pnpm version comes from packageManager in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Turborepo cache
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-ci-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-ci-${{ runner.os }}-
      - run: pnpm run format:check
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run build
      - run: pnpm run test
      - run: pnpm exec harness lint-meta
