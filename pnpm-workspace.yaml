packages:
  - packages/*
  - apps/*
  - tooling/*

# Releases younger than 7 days are held back. The owner's own @noctcore scope is first party.
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - '@noctcore/*'

# esbuild (through fumadocs-mdx) runs a postinstall that only checks for, or downloads, its binary.
# The platform binary arrives as an optional dependency, so the script is not needed.
ignoredBuiltDependencies:
  - esbuild
